[package]
name = "net"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rmds"
path = "src/bin/rmds.rs"

[dependencies]
protocol = { path = "../protocol" }
bytes = "1"
fastrand = "2"
log = "0.4"
quinn = { version = "0.11", default-features = false, features = ["log", "runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
serde = "1"
socket2 = "0.6"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std"] }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
