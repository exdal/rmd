[package]
name = "render"
version = "1.9.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
dmm = { path = "../dmm" }
dmi = { path = "../dmi" }

vir = { git = "https://github.com/exdal/vir.git", package = "vir" }
ash = "0.38.0"
raw-window-handle = "0.6.0"
dear-imgui-rs = { version = "=0.17.0", features = ["multi-viewport"] }
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-metal = "1"

[build-dependencies]
shader-slang = "0.1.0"
