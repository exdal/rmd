[package]
name = "editor"
version = "1.13.0"
edition.workspace = true

[[bin]]
name = "rmde"
path = "src/main.rs"

[dependencies]
bitflags.workspace = true
base.workspace = true
defines.workspace = true
preprocessor.workspace = true
ast.workspace = true
sema.workspace = true
objtree.workspace = true
ir.workspace = true
codegen.workspace = true
vm.workspace = true
dmm.workspace = true
prefab.workspace = true
dmi.workspace = true
net.workspace = true
render.workspace = true
ui.workspace = true
winit.workspace = true
raw-window-handle.workspace = true
dear-imgui-rs = { workspace = true, features = ["serde"] }
dear-imgui-winit.workspace = true
serde = { workspace = true, features = ["derive"] }
toml.workspace = true
rfd = "0.17.2"
png.workspace = true
ring.workspace = true
log.workspace = true
shlex = "1.3"
semver = "1"
ureq = { version = "3", features = ["json"] }
gix = { version = "0.87.1", default-features = false, features = ["attributes", "index", "revision", "max-performance-safe", "sha1"] }
jiff = "0.2"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[lints]
workspace = true
