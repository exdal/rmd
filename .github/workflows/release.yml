name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to build and upload
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.id || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  ci:
    name: Validate, test, and build
    uses: ./.github/workflows/ci.yml
    with:
      expected_tag: ${{ github.event.release.tag_name || inputs.release_tag }}
      checkout_ref: ${{ github.event.release.tag_name || inputs.release_tag }}

  publish:
    name: Upload release assets
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: rmd-${{ needs.ci.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Verify the release assets
        shell: pwsh
        env:
          VERSION: ${{ needs.ci.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $expected = @(
            "rmd-$env:VERSION-x86_64-pc-windows-msvc.exe",
            "rmd-$env:VERSION-x86_64-unknown-linux-gnu"
          ) | Sort-Object
          $actual = @(Get-ChildItem -File -LiteralPath 'dist' | ForEach-Object Name | Sort-Object)
          if (Compare-Object -ReferenceObject $expected -DifferenceObject $actual) {
            throw "Release assets did not match the expected Windows and Linux files. Found: $($actual -join ', ')"
          }

      - name: Upload assets to the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          $assets = @(Get-ChildItem -File -LiteralPath 'dist' | Sort-Object Name | ForEach-Object FullName)
          & gh release upload $env:RELEASE_TAG @assets --clobber --repo $env:GH_REPO
          if ($LASTEXITCODE -ne 0) {
            throw "Could not upload assets to release '$env:RELEASE_TAG'."
          }
